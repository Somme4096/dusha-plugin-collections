[project]
name = "dusha-ambient"
version = "0.1.0"
description = "Events and metrics from every device, merged into one picture agents can read"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "psutil>=5.9", "Pillow>=10", "dbus-next>=0.2.3; sys_platform == 'linux'"]

[tool.uv]
package = false

[tool.dusha]
entry = "ambient"
inject = ["settings", "prompts", "providers", "api", "cli", "mcp"]
